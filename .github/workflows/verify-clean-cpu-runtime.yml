name: Qualify isolated clean ComfyUI CPU node runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-clean-cpu-runtime.yml"
      - "scripts/qualify_clean_comfy_cpu.py"
      - "scripts/qualify_scail_native_mask_cpu.py"
      - "tests/test_scail_native_mask_cpu.py"
      - "tests/fixtures/comfy_scail_cpu_source/**"
      - "scripts/qualify_synthetic_video_timing.py"
      - "tests/test_synthetic_video_timing.py"
      - "scripts/audit_selected_workflow_nodes.py"
      - "tests/test_selected_workflow_node_coverage.py"
      - "workflows/commercial-compatible/**"
      - "runpod/commercial-compatible/prepare.py"
      - "DEPENDENCIES.lock"
      - "scripts/qualify_prores_12bit.py"
      - "scripts/qualify_vhs_16bit.py"
      - "tests/test_vhs_16bit_contract.py"
      - "tests/fixtures/comfy_12bit_source/**"
      - "scripts/audit_vhs_prores_precision.py"
      - "tests/test_vhs_prores_precision_contract.py"
      - "tests/test_true_12bit_prores_contract.py"
      - "scripts/usdu_offline_guard/sitecustomize.py"
      - "tests/test_clean_comfy_cpu_contract.py"
      - "custom_nodes/mask_propagate_optical_flow/**"
      - "docs/clean-cpu-runtime-qualification.md"
  pull_request:
    paths:
      - ".github/workflows/verify-clean-cpu-runtime.yml"
      - "scripts/qualify_clean_comfy_cpu.py"
      - "scripts/qualify_scail_native_mask_cpu.py"
      - "tests/test_scail_native_mask_cpu.py"
      - "tests/fixtures/comfy_scail_cpu_source/**"
      - "scripts/qualify_synthetic_video_timing.py"
      - "tests/test_synthetic_video_timing.py"
      - "scripts/audit_selected_workflow_nodes.py"
      - "tests/test_selected_workflow_node_coverage.py"
      - "workflows/commercial-compatible/**"
      - "runpod/commercial-compatible/prepare.py"
      - "DEPENDENCIES.lock"
      - "scripts/qualify_prores_12bit.py"
      - "scripts/qualify_vhs_16bit.py"
      - "tests/test_vhs_16bit_contract.py"
      - "tests/fixtures/comfy_12bit_source/**"
      - "scripts/audit_vhs_prores_precision.py"
      - "tests/test_vhs_prores_precision_contract.py"
      - "tests/test_true_12bit_prores_contract.py"
      - "scripts/usdu_offline_guard/sitecustomize.py"
      - "tests/test_clean_comfy_cpu_contract.py"
      - "custom_nodes/mask_propagate_optical_flow/**"
      - "docs/clean-cpu-runtime-qualification.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-comfy-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-cpu-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout OSF workflow source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Choose Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test CPU smoke driver before external installs
        run: python -B -m unittest discover -s tests -p "test_clean_comfy_cpu_contract.py" -v
      - name: Test actual 12-bit source and quantization rejection contracts
        run: python -B -m unittest discover -s tests -p "test_true_12bit_prores_contract.py" -v
      - name: Validate all selected 11 graph class IDs and profile inventory
        run: python -B -m unittest discover -s tests -p "test_selected_workflow_node_coverage.py" -v
      - name: Check pinned VHS ProRes source precision contracts
        run: python -B -m unittest discover -s tests -p "test_vhs_prores_precision_contract.py" -v
      - name: Test synthetic video frame timing and cadence contracts
        run: python -B -m unittest discover -s tests -p "test_synthetic_video_timing.py" -v
      - name: Test VHS input precision contrast contract without external installs
        run: python -B -m unittest discover -s tests -p "test_vhs_16bit_contract.py" -v
      - name: Verify synthetic native SCAIL CPU source and result contracts
        run: python -B -m unittest discover -s tests -p "test_scail_native_mask_cpu.py" -v
      - name: Fetch exact reviewed upstream ComfyUI commit into runner scratch
        env:
          COMFY_SHA: 08cf0284ff45723aa67841c80cabb0e3cb50c9d7
        run: |
          set -euo pipefail
          git init "${{ runner.temp }}/osf-disposable-ComfyUI"
          git -C "${{ runner.temp }}/osf-disposable-ComfyUI" remote add origin https://github.com/Comfy-Org/ComfyUI.git
          git -C "${{ runner.temp }}/osf-disposable-ComfyUI" fetch --no-tags --depth=1 origin "$COMFY_SHA"
          git -C "${{ runner.temp }}/osf-disposable-ComfyUI" checkout --detach "$COMFY_SHA"
          test "$(git -C "${{ runner.temp }}/osf-disposable-ComfyUI" rev-parse HEAD)" = "$COMFY_SHA"
          cp -R custom_nodes/mask_propagate_optical_flow "${{ runner.temp }}/osf-disposable-ComfyUI/custom_nodes/"
          cp -R tests/fixtures/comfy_scail_cpu_source "${{ runner.temp }}/osf-disposable-ComfyUI/custom_nodes/"
          cp -R tests/fixtures/comfy_12bit_source "${{ runner.temp }}/osf-disposable-ComfyUI/custom_nodes/"
      - name: Fetch five exact reviewed public custom-node commits
        run: |
          set -euo pipefail
          dst="${{ runner.temp }}/osf-disposable-ComfyUI/custom_nodes"
          fetch_pinned() {
            local name="$1" url="$2" sha="$3"
            git init "$dst/$name"
            git -C "$dst/$name" remote add origin "$url"
            git -C "$dst/$name" fetch --no-tags --depth=1 origin "$sha"
            git -C "$dst/$name" checkout --detach "$sha"
            test "$(git -C "$dst/$name" rev-parse HEAD)" = "$sha"
          }
          fetch_pinned "ComfyUI-VideoHelperSuite" "https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git" "2984ec4c4b93292421888f38db74a5e8802a8ff8"
          fetch_pinned "rgthree-comfy" "https://github.com/rgthree/rgthree-comfy.git" "d92cad68a6e92a1c5d4032d3ac53f79ea44b08e4"
          fetch_pinned "ComfyUI-DownsampleFPS" "https://github.com/Austat/ComfyUI-DownsampleFPS.git" "4d741ef8e33b0c5111ad21033f9408acffc63651"
          fetch_pinned "ComfyUI-GGUF" "https://github.com/city96/ComfyUI-GGUF.git" "6ea2651e7df66d7585f6ffee804b20e92fb38b8a"
          fetch_pinned "ComfyUI_UltimateSDUpscale" "https://github.com/ssitu/ComfyUI_UltimateSDUpscale.git" "a5547db9e1d07d3318bb21e9e9c474f4c1e9c8df"
      - name: Fetch exact UltimateSDUpscale GPLv3 gitlink and forbid mutable fallback
        run: |
          set -euo pipefail
          p="${{ runner.temp }}/osf-disposable-ComfyUI/custom_nodes/ComfyUI_UltimateSDUpscale"
          sha="2322caa480535b1011a1f9c18126d85ea444f146"
          expected="$(printf '160000 commit %s\trepositories/ultimate_sd_upscale' "$sha")"
          test "$(git -C "$p" ls-tree HEAD repositories/ultimate_sd_upscale)" = "$expected"
          sub="$p/repositories/ultimate_sd_upscale"
          test -d "$sub"
          git init "$sub"
          git -C "$sub" remote add origin https://github.com/Coyote-A/ultimate-upscale-for-automatic1111.git
          git -C "$sub" fetch --no-tags --depth=1 origin "$sha"
          git -C "$sub" checkout --detach "$sha"
          test "$(git -C "$sub" rev-parse HEAD)" = "$sha"
          test -s "$sub/LICENSE"
          test -s "$sub/scripts/ultimate-upscale.py"
      - name: Install pinned CPU-only torch and torchvision in disposable CI
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu             "torch==2.8.0" "torchvision==0.23.0"
      - name: Install real ComfyUI Python runtime without model weights
        run: |
          python -m pip install --disable-pip-version-check             -r "${{ runner.temp }}/osf-disposable-ComfyUI/requirements.txt"             "opencv-python-headless==4.10.0.84"
          python -m pip check
      - name: Install pinned external custom-node Python prerequisites
        run: |
          # VideoHelperSuite requires imageio-ffmpeg. The opencv-python
          # requirement is provided by the already installed headless wheel.
          python -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0" "gguf==0.13.0"
          python -m pip check
      - name: Audit workflows, codecs, VHS precision and native SCAIL mask CPU rendering
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          DO_NOT_TRACK: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python -B scripts/qualify_clean_comfy_cpu.py             --comfy-root "${{ runner.temp }}/osf-disposable-ComfyUI"             --report "${{ runner.temp }}/osf-clean-comfy-cpu-evidence.json"
      - name: Retain metadata-only CPU smoke evidence, not third-party binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osf-clean-comfy-cpu-evidence
          path: ${{ runner.temp }}/osf-clean-comfy-cpu-evidence.json
          if-no-files-found: error
          retention-days: 14
