name: Validate ComfyUI workflows and native output tools

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-public-workflows.yml"
      - "scripts/**"
      - "tests/**"
      - "workflows/**"
      - "runpod/**"
      - "DEPENDENCIES.lock"
      - "THIRD_PARTY_LICENSES.md"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/verify-public-workflows.yml"
      - "scripts/**"
      - "tests/**"
      - "workflows/**"
      - "runpod/**"
      - "DEPENDENCIES.lock"
      - "THIRD_PARTY_LICENSES.md"
      - "README.md"
  workflow_dispatch:

# No repository secrets, custom nodes, model weights or GPU required.
permissions:
  contents: read

concurrency:
  group: structure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pin standard-library Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Run synthetic regression tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate every published workflow graph
        run: python scripts/validate-workflow-json.py workflows > "${{ runner.temp }}/graph-audit.json"
      - name: Inventory eleven selected API/UI node requirements without claiming runtime
        run: python scripts/audit-selected-11-node-coverage.py --output "${{ runner.temp }}/selected-11-node-coverage.json"
      - name: Verify exact four selected API graph DAGs and source identities
        run: python -B scripts/audit_selected_api_topology.py --output "${{ runner.temp }}/selected-four-api-topology.json"
      - name: Audit embedded mm_upscale active links and unresolved reverse references
        run: python scripts/audit_embedded_group_links.py --output "${{ runner.temp }}/mm-upscale-link-preflight.json"
      - name: Prove reversible orphan reverse-link candidate without changing selected UI export
        run: python -B scripts/plan_mm_upscale_reverse_refs.py --output "${{ runner.temp }}/mm-upscale-reverse-ref-candidate-hold.json"
      - name: Reconcile mm_upscale embedded extension provider hints against canonical lock
        run: python scripts/audit_embedded_group_provider_dependencies.py --output "${{ runner.temp }}/mm-upscale-provider-gaps.json"
      - name: Check reviewed candidate source map for embedded mm_upscale providers
        run: python scripts/audit_embedded_group_source_candidates.py --output "${{ runner.temp }}/mm-upscale-reviewed-source-candidates.json"
      - name: Reconcile independent source audits into fail-closed eleven-workflow HOLD
        run: |
          python -B scripts/check_selected11_release_hold.py \
            --coverage "${{ runner.temp }}/selected-11-node-coverage.json" \
            --links "${{ runner.temp }}/mm-upscale-link-preflight.json" \
            --providers "${{ runner.temp }}/mm-upscale-provider-gaps.json" \
            --candidates "${{ runner.temp }}/mm-upscale-reviewed-source-candidates.json" \
            --output "${{ runner.temp }}/selected11-release-hold.json"
      - name: Check embedded Essentials socket parity against reviewed candidate source
        run: python scripts/audit_mm_upscale_essentials_sockets.py --output "${{ runner.temp }}/mm-upscale-essentials-sockets.json"
      - name: Check embedded KJNodes sockets against historical pinned source
        run: python scripts/audit_mm_upscale_kjnodes_sockets.py --output "${{ runner.temp }}/mm-upscale-kjnodes-sockets.json"
      - name: Check embedded Custom-Scripts 23 historical UI/source sockets
        run: python scripts/audit_mm_upscale_custom_scripts_sockets.py --output "${{ runner.temp }}/mm-upscale-custom-scripts-sockets.json"
      - name: Check all 42 embedded Easy-Use sockets against reviewed source candidate
        run: python scripts/audit_mm_upscale_easy_use_sockets.py --output "${{ runner.temp }}/mm-upscale-easy-use-sockets.json"
      - name: Reject common private values and cache metadata
        run: python scripts/check-workflow-publication.py workflows > "${{ runner.temp }}/publication-audit.json"
